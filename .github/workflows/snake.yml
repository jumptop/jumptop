name: Snake
on:
  schedule:
    # Runs at 12 AM UTC (오전 9시 KST)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  generate:
    name: Generate contribution snake
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#70A5FD
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#70A5FD

      # output 브랜치에 생성된 SVG를 올림
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
